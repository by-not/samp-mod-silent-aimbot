; Silent Aimbot v1.0 - Configuration File
; Created By: not
; ═══════════════════════════════════════════════════════════════════════════════
; 
; INSTRUCTIONS:
; 1. Edit the values below to customize your aimbot behavior
; 2. Save the file after making changes
; 3. Use /recfg command in-game to reload without restarting
; 4. Lines starting with ; are comments and will be ignored
;
; ═══════════════════════════════════════════════════════════════════════════════

; ┌─────────────────────────────────────────────────────────────────────────────┐
; │ [Enabled] - Activation Settings                                              │
; └─────────────────────────────────────────────────────────────────────────────┘

[Enabled]

; AutoActivation - Auto-enable aimbot when script loads
; Values: 0 = Disabled (manual activation only)
;         1 = Enabled (starts active)
; Default: 1
AutoActivation=1

; GameKey - Hotkey to toggle aimbot on/off during gameplay
; Values: 0x00 = Disabled (command only)
;         0x71 = F2
;         0x72 = F3 (DEFAULT)
;         0x73 = F4
;         0x74 = F5
;         0x75 = F6
; Note: Use hexadecimal key codes (Google "Windows Virtual Key Codes")
; Default: 0x72 (F3)
GameKey=0x72


; ┌─────────────────────────────────────────────────────────────────────────────┐
; │ [Config] - Main Targeting Configuration                                      │
; └─────────────────────────────────────────────────────────────────────────────┘

[Config]

; HookDistance - Targeting circle radius (in pixels)
; Values: 1-999 pixels
; Recommendation:
;   - Close combat: 30-50
;   - Medium range: 50-80
;   - Long range: 80-150
; Note: Larger values = easier targeting but more obvious
; Default: 50
HookDistance=50

; IgnoreDistance - Ignore weapon's maximum range limit
; Values: 0 = Respect weapon range (RECOMMENDED)
;         1 = Ignore range limits (can look suspicious)
; Default: 0
; Warning: Setting to 1 allows unrealistic long-distance shots
IgnoreDistance=0

; WallShot - Ability to shoot through walls/obstacles
; Values: 0 = Only visible targets (RECOMMENDED)
;         1 = Shoot through walls (HIGH DETECTION RISK)
; Default: 0
; ⚠️ WARNING: Enabling this is extremely suspicious and easily detected
WallShot=0


; ┌─────────────────────────────────────────────────────────────────────────────┐
; │ [Protect] - Anti-Detection & Protection Features                             │
; └─────────────────────────────────────────────────────────────────────────────┘

[Protect]

; ModelGroup - Prevent shooting specific gang/faction skins
; Values: 0 = No protection (shoot everyone)
;         1 = Grove Street Families (skins: 105, 106, 107)
;         2 = Ballas Gang (skins: 102, 103, 104)
;         3 = Aztecas (skins: 114, 115, 116)
;         4 = Los Santos Vagos (skins: 108, 109, 110)
;         5 = San Fierro Rifa (skins: 173, 174, 175)
;         6 = Russian Mafia (skins: 111, 112, 125, 126, 127)
;         7 = La Cosa Nostra (skins: 113, 124)
;         8 = Yakuza/Triads (skins: 121, 122, 123, 117, 118, 120)
; Default: 0
; Feature: Shows "Fuego amigo" warning when aiming at protected models
ModelGroup=0

; HitRate - Accuracy percentage (shot success rate)
; Values: 0-100 (percentage)
; Examples:
;   0   = Never hit (0% accuracy)
;   25  = Very low accuracy (1 in 4 shots hit)
;   35  = Low accuracy (DEFAULT - looks natural)
;   50  = Medium accuracy (half shots hit)
;   75  = High accuracy (3 in 4 shots hit)
;   100 = Perfect accuracy (all shots hit - SUSPICIOUS)
; 
; 🎯 RECOMMENDED RANGES:
;   Stealth Mode:  25-40  (looks most human-like)
;   Balanced:      40-60  (good performance, still natural)
;   Aggressive:    60-80  (high performance, higher risk)
;   Rage Mode:     80-100 (obvious cheating)
;
; Default: 35
; Purpose: Makes your aim look more human and less bot-like
HitRate=35


; ┌─────────────────────────────────────────────────────────────────────────────┐
; │ [Sync] - Network Packet Synchronization                                      │
; └─────────────────────────────────────────────────────────────────────────────┘

[Sync]

; WeaponsUpdate - Modify weapon update packets
; Values: 0 = Disabled
;         1 = Enabled (RECOMMENDED)
; Default: 1
; Technical: Updates PACKET_WEAPONS_UPDATE with target player ID
WeaponsUpdate=1

; SendRPC - Send damage RPC calls to server
; Values: 0 = Disabled (no damage registration)
;         1 = Enabled (REQUIRED for damage)
; Default: 1
; Technical: Handles RPC_GIVETAKEDAMAGE communication
SendRPC=1

; AimSync - Synchronize camera aim with target
; Values: 0 = Disabled
;         1 = Enabled (RECOMMENDED)
; Default: 1
; Technical: Modifies PACKET_AIM_SYNC data stream
AimSync=1


; ┌─────────────────────────────────────────────────────────────────────────────┐
; │ [Misc] - Visual Effects & Notifications                                      │
; └─────────────────────────────────────────────────────────────────────────────┘

[Misc]

; ShowMessages - Display on-screen activation messages
; Values: 0 = Silent mode (no messages)
;         1 = Show messages (RECOMMENDED)
; Default: 1
; Messages shown:
;   - "Silent AIM Activated" (green)
;   - "Silent AIM Deactivated" (red)
;   - "Config file was successfully Reloaded"
ShowMessages=1

; DrawBlood - Create blood effects on hit
; Values: 0 = No blood effects
;         1 = Blood effects enabled (RECOMMENDED)
; Default: 1
; Visual: Adds realistic blood splatter at hit location
DrawBlood=1

; BloodDensity - Blood particle count per hit
; Values: 1-255 particles
; Ranges:
;   Low:    20-60   (minimal blood)
;   Normal: 80-120  (realistic)
;   Heavy:  150-200 (excessive bleeding)
;   Extreme: 200-255 (blood bath)
; Default: 120
; Note: Higher values may impact FPS slightly
BloodDensity=120


