; ═══════════════════════════════════════════════════════════════════════════════
; TROUBLESHOOTING & TIPS
; ═══════════════════════════════════════════════════════════════════════════════
;
; Q: Aimbot doesn't activate?
; A: Check AutoActivation=1 or press your GameKey (default F3)
;
; Q: Not hitting targets?
; A: Increase HookDistance or check if HitRate is too low
;
; Q: Getting detected easily?
; A: Lower HitRate to 30-40 and HookDistance to 30-50
;
; Q: Accidentally shooting teammates?
; A: Set ModelGroup to your gang number (1-8)
;
; Q: Changes not working?
; A: Use /recfg command in-game to reload configuration
;
; Q: Want to test settings?
; A: Start with Stealth Mode preset, then adjust gradually
;
